<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Offline — Sofe Node</title>
<link rel="icon" href="/images/icon-192.png" type="image/png" />
<meta name="theme-color" content="#040810" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #040810;
    color: #c8d7f0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 1.5rem;
  }
  .offline-card {
    text-align: center;
    max-width: 380px;
  }
  .offline-icon {
    font-size: 4rem;
    margin-bottom: 1.5rem;
    opacity: .8;
  }
  h1 {
    font-size: 1.5rem;
    font-weight: 700;
    margin-bottom: .8rem;
  }
  p {
    color: rgba(200,215,240,.6);
    line-height: 1.65;
    font-size: .95rem;
    margin-bottom: 2rem;
  }
  .btn {
    background: linear-gradient(135deg, #FF8A00, #ff7000);
    color: #1a1a2e;
    border: none;
    padding: .9rem 2rem;
    border-radius: 8px;
    font-weight: 700;
    font-size: .9rem;
    cursor: pointer;
    text-decoration: none;
    display: inline-block;
    transition: transform .15s;
  }
  .btn:hover { transform: translateY(-2px); }
  .tip {
    margin-top: 2.5rem;
    padding-top: 1.5rem;
    border-top: 1px solid rgba(200,215,240,.1);
    font-size: .8rem;
    color: rgba(200,215,240,.4);
    line-height: 1.6;
  }
</style>
</head>
<body>
<div class="offline-card">
  <div class="offline-icon">📡</div>
  <h1>You're offline</h1>
  <p>Looks like you've lost your internet connection. Some pages cached during your last visit may still work.</p>
  <button class="btn" onclick="window.location.reload()">Try again</button>
  <div class="tip">
    💡 Once you're back online, your dashboard, courses, and account will reload automatically.
  </div>
</div>
<script>
  // Auto-retry every 10 seconds if the connection comes back
  window.addEventListener('online', () => window.location.reload());
</script>
</body>
</html>
